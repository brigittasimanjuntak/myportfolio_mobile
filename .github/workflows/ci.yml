name: Flutter CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        
    - name: Install dependencies
      run: flutter pub get
      
    - name: Run Code Generation (json_serializable)
      run: dart run build_runner build --delete-conflicting-outputs
      
    - name: Analyze project source
      run: flutter analyze
      
    - name: Run tests
      run: flutter test